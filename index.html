<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sunset-purple: #4a1942;
            --sunset-red: #c94b4b;
            --sunset-orange: #ff8c42;
            --sunset-yellow: #ffd23f;
            --ocean-teal: #1abc9c;
            --ocean-dark: #16a085;
            --sand-light: #d4ac0d;
            --sand-dark: #b8860b;
            --shell-red: #E74C3C;
            --shell-dark: #C0392B;
            --pixel-white: #FFFFFF;
            --pixel-black: #1a1a2e;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: #1a1a2e;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ==================== PIXEL ART BEACH BACKGROUND ==================== */
        .beach-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Sunset Sky */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(180deg, 
                #1a0a2e 0%, 
                #4a1942 15%, 
                #c94b4b 35%, 
                #ff8c42 55%, 
                #ffd23f 70%,
                #ffb347 100%
            );
        }

        /* Pixel Sun */
        .sun {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: var(--sunset-yellow);
            box-shadow: 
                0 0 0 6px var(--sunset-orange),
                0 0 0 12px var(--sunset-red),
                0 0 40px var(--sunset-yellow),
                0 0 80px var(--sunset-orange);
        }

        /* Sun rays */
        .sun::before, .sun::after {
            content: '';
            position: absolute;
            background: var(--sunset-yellow);
        }

        .sun::before {
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 25px;
            box-shadow: 
                -25px 15px 0 var(--sunset-yellow),
                25px 15px 0 var(--sunset-yellow),
                -18px -18px 0 var(--sunset-orange),
                18px -18px 0 var(--sunset-orange);
        }

        /* Pixel Clouds */
        .pixel-cloud {
            position: absolute;
            background: var(--sunset-orange);
            opacity: 0.5;
        }

        .pixel-cloud:nth-child(1) {
            top: 12%;
            left: 8%;
            width: 60px;
            height: 16px;
            box-shadow: 
                -8px 8px 0 var(--sunset-orange),
                15px -4px 0 var(--sunset-orange),
                30px 4px 0 var(--sunset-orange);
        }

        .pixel-cloud:nth-child(2) {
            top: 8%;
            left: 45%;
            width: 80px;
            height: 20px;
            box-shadow: 
                -12px 10px 0 var(--sunset-orange),
                20px -6px 0 var(--sunset-orange),
                40px 6px 0 var(--sunset-orange);
        }

        .pixel-cloud:nth-child(3) {
            top: 15%;
            left: 75%;
            width: 50px;
            height: 14px;
            box-shadow: 
                -6px 6px 0 var(--sunset-orange),
                12px -3px 0 var(--sunset-orange),
                24px 3px 0 var(--sunset-orange);
        }

        /* Palm Tree Silhouettes */
        .palm-trees {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            height: 80px;
        }

        .palm-tree {
            position: absolute;
            bottom: 0;
        }

        .palm-tree::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 50px;
            background: #1a0a2e;
        }

        .palm-tree::after {
            content: '';
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 35px;
            background: transparent;
            box-shadow: 
                0 -25px 0 3px #1a0a2e,
                12px -28px 0 3px #1a0a2e,
                -12px -28px 0 3px #1a0a2e,
                20px -20px 0 3px #1a0a2e,
                -20px -20px 0 3px #1a0a2e;
        }

        .palm-tree:nth-child(1) { left: 3%; }
        .palm-tree:nth-child(2) { left: 88%; }
        .palm-tree:nth-child(3) { left: 12%; transform: scale(0.6); }
        .palm-tree:nth-child(4) { left: 80%; transform: scale(0.7); }

        /* Ocean */
        .ocean {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(180deg, var(--ocean-teal) 0%, var(--ocean-dark) 60%, #0e6655 100%);
        }

        .wave-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: repeating-linear-gradient(90deg, 
                transparent 0px, 
                transparent 18px,
                rgba(255,255,255,0.15) 18px,
                rgba(255,255,255,0.15) 22px
            );
            animation: wave-scroll 6s linear infinite;
        }

        @keyframes wave-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Sand Beach */
        .sand-beach {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(180deg, var(--sand-light) 0%, var(--sand-dark) 100%);
        }

        .sand-grain {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px),
                linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px);
            background-size: 6px 6px;
        }

        /* Seashells on sand */
        .seashells {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            height: 40px;
        }

        .seashell {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
        }

        .seashell:nth-child(1) { left: 8%; background: #ffb6c1; }
        .seashell:nth-child(2) { left: 25%; background: #fff; }
        .seashell:nth-child(3) { left: 45%; background: #ffb6c1; }
        .seashell:nth-child(4) { left: 62%; background: #fff; }
        .seashell:nth-child(5) { left: 78%; background: #ffb6c1; }
        .seashell:nth-child(6) { left: 92%; background: #fff; }

        /* ==================== SCREENS ==================== */
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 30px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            z-index: 1;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
        }

        /* ==================== CRAB ==================== */
        .crab-sprite {
            width: 100px;
            height: 70px;
            cursor: pointer;
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.4));
            animation: crab-idle 0.8s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes crab-idle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(-2deg); }
            75% { transform: translateY(-8px) rotate(2deg); }
        }

        .crab-sprite svg {
            width: 100%;
            height: 100%;
        }

        /* ==================== DIALOGUE BOX ==================== */
        .dialogue-box {
            background: #2d1b4e;
            border: 4px solid #fff;
            padding: 20px 30px;
            max-width: 480px;
            min-width: 280px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
            border-radius: 8px;
            margin-bottom: 30px;
            z-index: 20;
        }

        .dialogue-text {
            color: var(--pixel-white);
            font-size: 12px;
            line-height: 2;
            min-height: 50px;
            text-align: center;
        }

        /* ==================== START SCREEN ==================== */
        #start {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        .main-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 2rem;
            color: var(--pixel-black);
            margin-bottom: 30px;
            text-shadow: 3px 3px 0 rgba(255,255,255,0.3);
            line-height: 1.4;
        }

        .subtitle {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            color: var(--pixel-white);
            margin-bottom: 40px;
            text-shadow: 3px 3px 0 var(--pixel-black);
        }

        .start-button {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            padding: 20px 50px;
            background: linear-gradient(180deg, var(--shell-red) 0%, var(--shell-dark) 100%);
            color: var(--pixel-white);
            border: 4px solid var(--pixel-black);
            cursor: pointer;
            box-shadow: 5px 5px 0 var(--pixel-black);
            transition: transform 0.1s, box-shadow 0.1s;
            animation: btn-pulse 2s infinite;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-button:hover {
            background: linear-gradient(180deg, #ff6b6b 0%, var(--shell-red) 100%);
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 var(--pixel-black);
        }

        .start-button:active {
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0 var(--pixel-black);
        }

        @keyframes btn-pulse {
            0%, 100% { }
            50% { transform: scale(1.02); }
        }

        @media (max-width: 600px) {
            .main-title {
                font-size: 1rem;
            }
            .subtitle {
                font-size: 0.6rem;
            }
            .start-button {
                font-size: 0.8rem;
                padding: 15px 30px;
            }
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--sunset-yellow);
            animation: blink 0.3s infinite;
            vertical-align: middle;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ==================== CHASE SCREEN ==================== */
        #chase .crab-sprite {
            position: absolute;
            cursor: pointer;
            transition: left 0.8s ease-out, top 0.8s ease-out;
            z-index: 20;
            animation: crab-walk 0.6s ease-in-out infinite;
        }

        @keyframes crab-walk {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        #chase .crab-sprite:hover {
            transform: scale(1.1);
        }

        #chase .crab-sprite:active {
            transform: scale(0.9);
        }

        .roast-text {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            color: var(--shell-red);
            font-size: 14px;
            text-shadow: 3px 3px 0 var(--pixel-white), -1px -1px 0 var(--pixel-black);
            animation: roast-pop 0.3s ease-out;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes roast-pop {
            0% { transform: translateX(-50%) scale(0) rotate(-15deg); opacity: 0; }
            60% { transform: translateX(-50%) scale(1.2) rotate(5deg); }
            100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes roast-appear {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            60% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* ==================== MEMORY GAME ==================== */
        #memory-game .screen-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .game-title {
            color: var(--pixel-white);
            font-size: 14px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 var(--pixel-black);
            background: rgba(26, 10, 46, 0.7);
            padding: 10px 25px;
            border-radius: 6px;
            border: 3px solid var(--sunset-orange);
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 75px);
            gap: 12px;
            padding: 20px;
            background: rgba(26, 10, 46, 0.6);
            border-radius: 10px;
            border: 4px solid var(--sand-dark);
        }

        .memory-card {
            width: 75px;
            height: 75px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .memory-card.flipped {
            transform: rotateY(180deg);
        }

        .memory-card.matched {
            animation: match-glow 0.5s ease-out;
        }

        @keyframes match-glow {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); box-shadow: 0 0 25px var(--sunset-yellow); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 6px;
            border: 3px solid var(--pixel-black);
            box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
        }

        .card-back {
            background: linear-gradient(135deg, var(--shell-red) 25%, var(--shell-dark) 25%, var(--shell-dark) 50%, var(--shell-red) 50%, var(--shell-red) 75%, var(--shell-dark) 75%);
            background-size: 16px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-back::after {
            content: '?';
            font-size: 28px;
            color: var(--pixel-white);
            text-shadow: 2px 2px 0 var(--pixel-black);
        }

        .card-front {
            background: var(--pixel-white);
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .card-front svg {
            width: 100%;
            height: 100%;
        }

        /* ==================== FINAL SCREEN ==================== */
        #final {
            justify-content: center;
            padding-bottom: 0;
            background: linear-gradient(180deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%);
        }

        #final .crab-sprite {
            margin-bottom: 20px;
            animation: crab-bounce 0.6s ease-in-out infinite;
        }

        .birthday-title {
            color: var(--sunset-yellow);
            font-size: 28px;
            text-shadow: 4px 4px 0 var(--shell-red), 8px 8px 0 var(--pixel-black), 0 0 30px var(--sunset-orange);
            margin-bottom: 40px;
            animation: title-glow 2s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes title-glow {
            0%, 100% { 
                text-shadow: 4px 4px 0 var(--shell-red), 8px 8px 0 var(--pixel-black);
                transform: scale(1);
            }
            50% { 
                text-shadow: 4px 4px 0 var(--shell-red), 8px 8px 0 var(--pixel-black), 0 0 40px var(--sunset-yellow);
                transform: scale(1.03);
            }
        }

        .birthday-message {
            color: var(--pixel-white);
            font-size: 10px;
            line-height: 2.2;
            text-align: center;
            max-width: 460px;
            padding: 25px;
            background: rgba(255,255,255,0.08);
            border: 3px solid var(--pixel-white);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255,210,63,0.15);
            z-index: 10;
        }

        /* ==================== CONFETTI ==================== */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -20px;
            z-index: 1000;
            animation: confetti-fall linear forwards;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* ==================== BONUS BUTTON ==================== */
        .bonus-btn {
            margin-top: 25px;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            background: linear-gradient(180deg, var(--shell-red) 0%, var(--shell-dark) 100%);
            color: var(--pixel-white);
            border: 4px solid var(--pixel-black);
            cursor: pointer;
            box-shadow: 5px 5px 0 var(--pixel-black);
            transition: transform 0.1s, box-shadow 0.1s;
            animation: btn-pulse 2s infinite;
            border-radius: 4px;
            z-index: 10;
        }

        .bonus-btn:hover {
            background: linear-gradient(180deg, #ff6b6b 0%, var(--shell-red) 100%);
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 var(--pixel-black);
        }

        .bonus-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 var(--pixel-black);
        }

        @keyframes btn-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* ==================== BONUS OVERLAY ==================== */
        .bonus-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .bonus-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .bonus-content {
            background: linear-gradient(180deg, var(--sunset-yellow) 0%, var(--sunset-orange) 100%);
            border: 6px solid var(--pixel-white);
            padding: 40px;
            text-align: center;
            animation: bonus-pop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-radius: 10px;
            box-shadow: 0 0 50px var(--sunset-yellow);
        }

        @keyframes bonus-pop {
            0% { transform: scale(0) rotate(-20deg); }
            70% { transform: scale(1.15) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .bonus-content h2 {
            color: var(--pixel-white);
            font-size: 16px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 var(--shell-red);
        }

        .bonus-close {
            margin-top: 20px;
            padding: 10px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            background: var(--ocean-dark);
            color: var(--pixel-white);
            border: 3px solid var(--pixel-white);
            cursor: pointer;
            border-radius: 4px;
        }

        /* ==================== MEMORY DIALOGUE ==================== */
        .memory-completion-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(26, 10, 46, 0.85);
            z-index: 30;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 550px) {
            .memory-grid {
                grid-template-columns: repeat(3, 60px);
                gap: 8px;
                padding: 12px;
            }
            .memory-card {
                width: 60px;
                height: 60px;
            }
            .card-front svg {
                width: 40px;
                height: 40px;
            }
            .birthday-title {
                font-size: 18px;
            }
            .dialogue-text {
                font-size: 9px;
            }
            .dialogue-box {
                min-width: 250px;
                padding: 15px 20px;
            }
            .crab-sprite {
                width: 80px;
                height: 56px;
            }
            .game-title {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <!-- PIXEL ART BEACH BACKGROUND -->
    <div class="beach-bg">
        <div class="sky"></div>
        <div class="sun"></div>
        <div class="pixel-cloud"></div>
        <div class="pixel-cloud"></div>
        <div class="pixel-cloud"></div>
        <div class="palm-trees">
            <div class="palm-tree"></div>
            <div class="palm-tree"></div>
            <div class="palm-tree"></div>
            <div class="palm-tree"></div>
        </div>
        <div class="ocean">
            <div class="wave-lines"></div>
        </div>
        <div class="sand-beach">
            <div class="sand-grain"></div>
            <div class="seashells">
                <div class="seashell"></div>
                <div class="seashell"></div>
                <div class="seashell"></div>
                <div class="seashell"></div>
                <div class="seashell"></div>
                <div class="seashell"></div>
            </div>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="start" class="screen active">
        <h1 class="main-title">Birthday Website For A Big Back Bum</h1>
        <p class="subtitle">by the real big back bum (Raenn)</p>
        <button id="start-btn" class="start-button">START</button>
    </div>

    <!-- INTRO SCREEN -->
    <div id="intro" class="screen">
        <div class="crab-sprite" id="intro-crab">
            <svg viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
                <!-- Claws -->
                <rect x="5" y="15" width="18" height="12" fill="#E74C3C" rx="2"/>
                <rect x="2" y="12" width="8" height="8" fill="#E74C3C" rx="1"/>
                <rect x="77" y="15" width="18" height="12" fill="#E74C3C" rx="2"/>
                <rect x="90" y="12" width="8" height="8" fill="#E74C3C" rx="1"/>
                <!-- Body -->
                <rect x="25" y="22" width="50" height="22" fill="#C0392B" rx="3"/>
                <rect x="28" y="18" width="44" height="6" fill="#E74C3C" rx="2"/>
                <!-- Shell pattern -->
                <rect x="33" y="26" width="6" height="6" fill="#E74C3C"/>
                <rect x="43" y="26" width="6" height="6" fill="#E74C3C"/>
                <rect x="53" y="26" width="6" height="6" fill="#E74C3C"/>
                <rect x="61" y="26" width="6" height="6" fill="#E74C3C"/>

    <script>
        // ==================== SOUND EFFECTS (Web Audio API) ====================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = initAudio();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);

                switch(type) {
                    case 'click':
                        // Short blip for clicking
                        oscillator.type = 'square';
                        oscillator.frequency.setValueAtTime(800, ctx.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.1);
                        gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                        oscillator.start(ctx.currentTime);
                        oscillator.stop(ctx.currentTime + 0.1);
                        break;
                    case 'type':
                        // Typing sound (subtle click)
                        oscillator.type = 'sine';
                        oscillator.frequency.setValueAtTime(1200, ctx.currentTime);
                        gainNode.gain.setValueAtTime(0.03, ctx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
                        oscillator.start(ctx.currentTime);
                        oscillator.stop(ctx.currentTime + 0.03);
                        break;
                    case 'match':
                        // Success chime
                        oscillator.type = 'sine';
                        oscillator.frequency.setValueAtTime(523, ctx.currentTime);
                        oscillator.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
                        oscillator.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
                        gainNode.gain.setValueAtTime(0.15, ctx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                        oscillator.start(ctx.currentTime);
                        oscillator.stop(ctx.currentTime + 0.4);
                        break;
                    case 'wrong':
                        // Wrong buzzer
                        oscillator.type = 'sawtooth';
                        oscillator.frequency.setValueAtTime(200, ctx.currentTime);
                        oscillator.frequency.setValueAtTime(150, ctx.currentTime + 0.1);
                        oscillator.frequency.setValueAtTime(100, ctx.currentTime + 0.2);
                        gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                        oscillator.start(ctx.currentTime);
                        oscillator.stop(ctx.currentTime + 0.3);
                        break;
                    case 'win':
                        // Victory fanfare
                        const notes = [523, 587, 659, 698, 784, 880, 988, 1047];
                        notes.forEach((freq, i) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
                            gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.1);
                            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.2);
                            osc.start(ctx.currentTime + i * 0.1);
                            osc.stop(ctx.currentTime + i * 0.1 + 0.2);
                        });
                        break;
                    case 'birthday':
                        // Birthday tune
                        const bdayNotes = [392, 392, 440, 392, 523, 480, 392, 392, 440, 392, 587, 523];
                        bdayNotes.forEach((freq, i) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.15);
                            gain.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.15);
                            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.25);
                            osc.start(ctx.currentTime + i * 0.15);
                            osc.stop(ctx.currentTime + i * 0.15 + 0.25);
                        });
                        break;
                }
            } catch(e) {
                console.log('Audio not supported');
            }
        }

        // ==================== CHASE GAME ====================
        function startChaseGame() {
            const crab = document.getElementById('chase-crab');
            const chaseScreen = document.getElementById('chase');
            const screenWidth = chaseScreen.clientWidth - 100;
            const screenHeight = chaseScreen.clientHeight - 150;

            // Start on the sand (bottom area)
            const startX = screenWidth / 2 + 50;
            const startY = screenHeight - 50;
            crab.style.left = startX + 'px';
            crab.style.top = startY + 'px';

            // Move slower - every 1000ms
            moveInterval = setInterval(() => {
                const x = Math.random() * screenWidth + 50;
                const y = Math.random() * (screenHeight - 80) + 80;
                crab.style.left = x + 'px';
                crab.style.top = y + 'px';
            }, 1000);

            crab.onclick = handleChaseClick;
        }

        function handleChaseClick() {
            chaseClicks++;
            playSound('click');
            
            const roast = CONFIG.roastMessages[Math.floor(Math.random() * CONFIG.roastMessages.length)];
            showRoastText(roast);

            if (chaseClicks >= CONFIG.clickRequired) {
                clearInterval(moveInterval);
                showRoastText(CONFIG.chaseCompleteMessage);
                
                setTimeout(() => {
                    showScreen('memory-game');
                    initMemoryGame();
                }, 1500);
            }

        function showRoastText(text) {
            const existing = document.querySelector('.roast-text');

            const roastEl = document.createElement('div');
            roastEl.className = 'roast-text';
            roastEl.textContent = text;
            document.body.appendChild(roastEl);

            setTimeout(() => roastEl.remove(), 1000);

        // ==================== MEMORY GAME ====================
        function initMemoryGame() {
            const grid = document.getElementById('memory-grid');
            grid.innerHTML = '';

            let cards = [...CONFIG.cardData, ...CONFIG.cardData];
            cards = shuffleArray(cards);

            cards.forEach((cardData, index) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.id = cardData.id;
                card.dataset.message = cardData.message;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <span style="font-size: 36px;">${cardData.emoji}</span>
                    </div>
                `;

                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
        }

        function getCardArt(type) {
            const card = CONFIG.cardData.find(c => c.id === type);
            return card ? `<span style="font-size: 36px;">${card.emoji}</span>` : '❓';
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function flipCard(card) {
            if (isFlipping || card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }

            card.classList.add('flipped');
            playSound('click');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isFlipping = true;
            const [card1, card2] = flippedCards;

            if (card1.dataset.id === card2.dataset.id) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                playSound('match');
                
                // Show the custom message for this pair
                showMatchMessage(card1.dataset.message);
                
                flippedCards = [];
                isFlipping = false;

                if (matchedPairs === totalPairs) {
                    playSound('win');
                    setTimeout(() => {
                        showMemoryCompletionDialogue();
                    }, 1500);
                }
            } else {
                // Show crab trash talking on wrong match
                showMemoryRoast();
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isFlipping = false;
                }, 1200);
            }
        }

            setTimeout(() => { if (matchDiv.parentNode) matchDiv.remove(); }, 4000);
        }

        function showMemoryCompletionDialogue() {
            const memoryScreen = document.getElementById('memory-game');
            
            // Add overlay with crab and dialogue
            const overlay = document.createElement('div');
            overlay.className = 'memory-completion-overlay';
            overlay.innerHTML = `
                <div class="crab-sprite">
                    <svg viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
                        <rect x="5" y="15" width="18" height="12" fill="#E74C3C" rx="2"/>
                        <rect x="2" y="12" width="8" height="8" fill="#E74C3C" rx="1"/>
                        <rect x="77" y="15" width="18" height="12" fill="#E74C3C" rx="2"/>
                        <rect x="90" y="12" width="8" height="8" fill="#E74C3C" rx="1"/>
                        <rect x="25" y="22" width="50" height="22" fill="#C0392B" rx="3"/>
                        <rect x="28" y="18" width="44" height="6" fill="#E74C3C" rx="2"/>
                        <rect x="33" y="26" width="6" height="6" fill="#E74C3C"/>
                        <rect x="43" y="26" width="6" height="6" fill="#E74C3C"/>
                        <rect x="53" y="26" width="6" height="6" fill="#E74C3C"/>
                        <rect x="61" y="26" width="6" height="6" fill="#E74C3C"/>
                        <rect x="32" y="12" width="8" height="8" fill="#FFFFFF" rx="1"/>
                        <rect x="60" y="12" width="8" height="8" fill="#FFFFFF" rx="1"/>
                        <rect x="34" y="14" width="3" height="3" fill="#1a1a2e"/>
                        <rect x="62" y="14" width="3" height="3" fill="#1a1a2e"/>
                        <rect x="22" y="44" width="6" height="12" fill="#E74C3C" rx="1"/>
                        <rect x="38" y="44" width="6" height="12" fill="#E74C3C" rx="1"/>
                        <rect x="54" y="44" width="6" height="12" fill="#E74C3C" rx="1"/>
                        <rect x="70" y="44" width="6" height="12" fill="#E74C3C" rx="1"/>
                    </svg>
                </div>
                <div class="dialogue-box">
                    <div class="dialogue-text">
                        <span class="memory-dialogue-text"></span><span class="cursor"></span>
                    </div>
                </div>
            `;
            memoryScreen.appendChild(overlay);

            memoryDialogueIndex = 0;
            memoryCharIndex = 0;
            typeMemoryDialogue();
        }

        function typeMemoryDialogue() {
            const textContainer = document.querySelector('.memory-dialogue-text');
            
            if (memoryDialogueIndex >= CONFIG.memoryCompleteDialogue.length) {
                setTimeout(() => {
                    showScreen('final');
                    showFinalMessage();
                }, 500);
                return;
            }

            const currentLine = CONFIG.memoryCompleteDialogue[memoryDialogueIndex];

            if (memoryCharIndex === 0) {
                textContainer.textContent = '';
            }

            if (memoryCharIndex < currentLine.length) {
                textContainer.textContent += currentLine[memoryCharIndex];
                memoryCharIndex++;
                playSound('type');
                setTimeout(typeMemoryDialogue, CONFIG.dialogueSpeed);
            } else {
                memoryCharIndex = 0;
                memoryDialogueIndex++;
                setTimeout(typeMemoryDialogue, 800);
            }
        }

        // ==================== FINAL SCREEN ====================
        function showFinalMessage() {
            playSound('birthday');
            const messageEl = document.getElementById('birthday-message-text');
            messageEl.innerHTML = CONFIG.finalMessage.replace(/\n/g, '<br>');
            startConfetti();
        }

        // ==================== CONFETTI ====================
        function startConfetti() {
            const colors = ['#E74C3C', '#3498DB', '#2ECC71', '#F39C12', '#9B59B6', '#1ABC9C', '#E91E63', '#FF5722', '#FFD23F'];
            
            for (let i = 0; i < CONFIG.confettiCount; i++) {
                setTimeout(() => createConfetti(colors), i * 50);
            }
        }

        function createConfetti(colors) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
            confetti.style.width = (Math.random() * 10 + 6) + 'px';
            confetti.style.height = (Math.random() * 10 + 6) + 'px';

            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 4500);
        }

        // ==================== BONUS ====================
        function showBonus() {
            playSound('click');
            document.getElementById('bonus-overlay').classList.add('active');
            
            for (let i = 0; i < 35; i++) {
                setTimeout(() => {
                    const bonusColors = ['#FFD700', '#FF69B4', '#00FF00', '#FF4500', '#00FFFF'];
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = bonusColors[Math.floor(Math.random() * bonusColors.length)];
                    confetti.style.animationDuration = '1s';
                    confetti.style.width = '16px';
                    confetti.style.height = '16px';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 1500);
                }, i * 30);
            }
        }

        function closeBonus() {
            playSound('click');
            document.getElementById('bonus-overlay').classList.remove('active');
        }

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', () => {
            // Game starts on the start screen, user must click START button
        });
    </script>
</body>
</html>
